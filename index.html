<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="--backimg: url(./galaxy.webp)" class="image-center">
    <div class="solar-system">
        <div style="--backimg: url(./sun.png)" class="sun image-center"></div>
        <div style="--width:150px; --orbit-s:8.8s" class="orbit">
            <div style="--backimg: url(./mercury.png); --planet-width:15px; --planet-s:5.86s" class="planet image-center"></div>
        </div>
        <div style="--width:200px; --orbit-s:22.5s" class="orbit">
            <div style="--backimg: url(./venus.png); --planet-width:20px; --planet-s:24.3s" class="planet image-center"></div>
        </div>
        <div style="--width:300px; --orbit-s:36.5s" class="orbit">
            <div style="--backimg: url(./earth.png); --planet-width:23px; --planet-s:1s" class="planet image-center"></div>
        </div>
        <div style="--width:400px; --orbit-s:68.7s" class="orbit">
            <div style="--backimg: url(./mars.png); --planet-width:17px; --planet-s:1.025s" class="planet image-center"></div>
        </div>
        <div style="--width:550px; --orbit-s:118.6s" class="orbit">
            <div style="--backimg: url(./jupiter.png); --planet-width:45px; --planet-s:0.41s" class="planet image-center"></div>
        </div>
        <div style="--width:650px; --orbit-s:294.6s" class="orbit">
            <div style="--backimg: url(./saturn.png); --planet-width:40px; --planet-s:0.445s" class="planet image-center"></div>
        </div>
        <div style="--width:750px; --orbit-s:840s" class="orbit">
            <div style="--backimg: url(./uranus.png); --planet-width:35px; --planet-s:0.717s" class="planet image-center"></div>
        </div>
        <div style="--width:850px; --orbit-s:1648s" class="orbit">
            <div style="--backimg: url(./neptune.png); --planet-width:33px; --planet-s:0.671s" class="planet image-center"></div>
        </div>
    </div>
</body>
</html>
